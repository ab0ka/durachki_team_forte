# contracts/ (A01): параметры сериализации и проверок ответа.
# Правило команды: каждая гипотеза — за флагом, по умолчанию ВЫКЛЮЧЕНА, пока L2 не измерил выигрыш.
# Переопределить файл: SENTINEL_CONTRACTS_CONFIG=/path/config.yaml
jury:
  max_frames: 3                        # ТЗ: 1–3 кадра-доказательства (не гипотеза)
  embed_rule_in_description: false     # ГИПОТЕЗА: дописывать первую норму из rules в description ответа жюри
coverage:
  # Инвариант (не гипотеза): «нет нарушения» только при подтверждённой полноте meta.coverage.
  min_ratio_for_no_violation: 0.98     # порог доли проанализированной длительности; подбирает L2
