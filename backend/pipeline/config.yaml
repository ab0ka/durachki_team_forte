# Kassa Sentinel — конфиг оркестратора (A03, backend/pipeline).
# Любой ключ можно переопределить: (1) файлом через SENTINEL_PIPELINE_CONFIG=path.yaml
# (глубокое слияние поверх этого), (2) env-переменными (см. README), (3) флагами CLI.

pipeline_version: "1.0.0"

mock: false                  # true ⇔ SENTINEL_MOCK=1: модули используют mock-бэкенды без весов
mock_missing_modules: true   # только в mock-режиме: отсутствующий модуль заменяется встроенным фейком

# Стадии по порядку. ingest и fusion выключить нельзя (у них есть встроенный fallback).
stages:
  ingest: true
  detect: true
  track: true
  pose: true
  scene: true
  rules: true
  temporal: true
  vlm_verify: true
  vlm_discover: true
  fusion: true

detect_every_n: 1            # аргумент every_n для ml.detect.detect

sampling:
  base_fps: 5.0              # частота сэмплирования по умолчанию
  min_fps: 2.0               # ниже не опускаемся даже для очень длинных видео
  fps_step: 0.5              # fps округляется вниз к сетке → стабильные ключи кэша
  max_frames_gpu: 900        # потолок числа сэмплированных кадров на GPU (145 с × 5 fps = 725)
  max_frames_cpu: 300        # на CPU всё в ~10 раз медленнее → меньше кадров
  reference_deadline_s: 240  # если дедлайн жёстче — fps снижается пропорционально
  min_deadline_scale: 0.4

# Мягкие бюджеты стадий (сек) для эталонного видео: 145 с при 5 fps на RTX 4060 (цель ≤ 60 с).
# Масштабируются по числу кадров; используются для решения «запускать ли необязательную стадию».
budgets_s:
  ingest: 6
  detect: 14
  track: 3
  pose: 10
  scene: 3
  rules: 1
  temporal: 15
  vlm_verify: 25
  vlm_discover: 20
  fusion: 4
reference_frames: 725

timeouts:
  hard_factor: 4.0           # жёсткий таймаут стадии = max(бюджет × hard_factor, min_s) ...
  min_s: 20.0                # ... (min_s покрывает холодную загрузку весов) ...
  cpu_factor: 4.0            # ... ×cpu_factor на CPU; и никогда не больше остатка до дедлайна

reserve_s:
  fusion: 12                 # всегда оставляем на финальное слияние
  vlm_min_budget: 6          # если на VLM остаётся меньше — стадия пропускается
  essential_min: 1.5         # обязательная стадия стартует, только если осталось больше

optional_stages: [pose, vlm_verify, vlm_discover]  # пропускаются первыми при отставании
min_start_fraction: 0.6      # необязательная стадия стартует, если влезает ≥ 60% её (масштабированного) бюджета

partial:
  enabled: true
  milestones: [after_core, after_vlm_verify]  # когда писать data/jobs/<id>/partial.json
  margin_s: 25               # при остатке < margin_s промежуточный результат пишется перед каждой стадией

cache:
  mode: read_write           # off | read_write | from_cache (последний: CV из кэша, rules+fusion заново)
  normalize_outputs: true    # выход стадии всегда проходит JSON-roundtrip → кэш и «живой» прогон идентичны

gpu:
  device: auto               # auto | cuda | cpu   (env SENTINEL_DEVICE)
  vram_total_gb: 8.0
  vram_reserve_gb: 0.7       # CUDA-контекст, фрагментация, активации
  concurrency: 2             # сколько GPU-стадий одновременно (detect ∥ temporal); VLM — эксклюзивно
  lock_timeout_s: 90         # ожидание GPU-шлюза (кросс-задачно), дальше стадия пропускается
  empty_cache_between_stages: true
  vlm_policy: auto           # auto | keep | on_demand | off   (env SENTINEL_VLM_POLICY)
  vram_gb:                   # оценки резидентной памяти моделей, ГБ
    detect: 1.0
    pose: 0.5
    temporal: 1.0
    vlm_verify: 5.0
    vlm_discover: 5.0

gpu_stages: [detect, pose, temporal, vlm_verify, vlm_discover]
exclusive_gpu_stages: [vlm_verify, vlm_discover]

frames:
  thread_safe_clip: true     # обёртка клипа с локом: temporal читает кадры параллельно с detect
  cache_mb: 512              # общий кэш декодированных кадров (заполняется до лимита, без вытеснения)

paths:
  ascii_safe: auto           # auto (только Windows) | always | never: кириллица в пути → ASCII-хардлинк

fallback_fusion:
  event_threshold: 0.5       # минимальная уверенность события для нарушения
  merge_window_s: 8.0        # события одного типа ближе этого окна сливаются
  risk_threshold: 0.75       # только риск-кривая (без событий): пик выше порога → V99
  max_violations: 5
  evidence_max_side: 640
  evidence_jpeg_quality: 82
  blur_heads: true           # размытие верхней части бокса человека на кадрах-доказательствах

warmup:
  synthetic_seconds: 2.0
  deadline_s: 120
  vlm: false                 # прогревать ли VLM (≈5 ГБ VRAM) при старте сервера
