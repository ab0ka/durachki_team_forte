# Kassa Sentinel CI (владелец A01).
# Обязательные проверки (без continue-on-error, падение = красный CI): core, modules (матрица, fail-fast: false), e2e.
# Необязательные (информационные): frontend-сборка, e2e через backend.pipeline.run, ownership для PR без [Axx].
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SENTINEL_MOCK: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  CORE_DEPS: "numpy>=1.26 pyyaml>=6 jsonschema>=4.20 pytest>=8 ruff>=0.5 opencv-python-headless>=4.8"

jobs:
  core:
    name: core (contracts, testkit, scripts, лицензии)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core deps
        run: python -m pip install $CORE_DEPS
      - name: Ruff (A01)
        run: ruff check contracts testkit scripts
      - name: Frozen contract v1 unchanged
        run: python -m pytest contracts/tests/test_contract_frozen.py -q
      - name: Tests (contracts, testkit, scripts)
        run: python -m pytest contracts testkit scripts -m "not gpu and not slow" -q
      - name: Example responses match TZ schema
        run: |
          python -m contracts.validate --jury contracts/examples/job_done_tz.json contracts/examples/jury_done_full.json \
            contracts/examples/job_processing.json contracts/examples/job_no_violation.json contracts/examples/job_failed.json
          python -m contracts.validate contracts/examples/job_done_full.json contracts/examples/ui_processing.json
      - name: Licenses / no cloud APIs / no weights or videos in git
        run: python scripts/check_licenses.py
      - name: Fallback-копии контракта совпадают с каноном
        run: python scripts/check_fallbacks.py
      - name: Медиа, веса и файлы > 5 МБ не попали в git
        run: python scripts/guard_media.py --all

  modules:
    name: module ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend/api
          - backend/pipeline
          - ml/ingest
          - ml/detect
          - ml/track
          - ml/pose
          - ml/scene
          - ml/rules
          - ml/temporal
          - ml/vlm
          - ml/fusion
          - norms
          - copilot
          - eval
          - deploy
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - name: Module present in this branch?
        id: present
        run: |
          if [ -d "$MODULE" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::$MODULE отсутствует в этой ветке — пропуск"; fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ${{ matrix.module }}/requirements*.txt
      - name: Install deps (CI-light, без torch/CUDA)
        if: steps.present.outputs.present == 'true'
        run: |
          python -m pip install $CORE_DEPS
          python scripts/ci_requirements.py "$MODULE" > "$RUNNER_TEMP/req-ci.txt"
          echo "--- CI requirements for $MODULE:"; cat "$RUNNER_TEMP/req-ci.txt"
          if [ -s "$RUNNER_TEMP/req-ci.txt" ]; then python -m pip install -r "$RUNNER_TEMP/req-ci.txt"; fi
      - name: Ruff
        if: steps.present.outputs.present == 'true'
        run: ruff check "$MODULE"
      - name: Pytest (not gpu and not slow)
        if: steps.present.outputs.present == 'true'
        run: |
          set +e
          python -m pytest "$MODULE" -m "not gpu and not slow" -q
          rc=$?
          if [ "$rc" -eq 5 ]; then echo "::warning::$MODULE: тесты не найдены"; exit 0; fi
          exit "$rc"

  e2e:
    name: e2e (mock-пайплайн на синтетическом видео)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps (core + CI-light deps всех модулей)
        run: |
          python -m pip install $CORE_DEPS
          python scripts/ci_requirements.py --all > "$RUNNER_TEMP/req-ci.txt"
          cat "$RUNNER_TEMP/req-ci.txt"
          if [ -s "$RUNNER_TEMP/req-ci.txt" ]; then python -m pip install -r "$RUNNER_TEMP/req-ci.txt"; fi
      # --strict-stages: модуль, который упал или вернул выход не по контракту, роняет CI (а не тихо заменяется фикстурой)
      - name: E2E по стадиям контракта (строго; схема ответа жюри обязательна)
        run: python -m testkit.e2e_stub --no-backend --strict-stages --scenarios clean,V01,V03,V07 --duration 8 --fps 10 --out "$RUNNER_TEMP/e2e"
      - name: E2E на кейсах спецификации (две планировки, строго)
        run: python -m testkit.e2e_stub --suite spec --no-backend --strict-stages --cases leave_clean,leave_cash,client_opposite,mobile,desk_phone,lights_off_cash --layouts A,B --fps 5 --out "$RUNNER_TEMP/e2e_spec"

  e2e-backend:
    name: e2e через backend.pipeline.run (необязательная)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Has backend/pipeline?
        id: be
        run: |
          if [ -d backend/pipeline ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::backend/pipeline нет — пропуск"; fi
      - uses: actions/setup-python@v5
        if: steps.be.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        if: steps.be.outputs.present == 'true'
        run: |
          python -m pip install $CORE_DEPS
          python scripts/ci_requirements.py --all > "$RUNNER_TEMP/req-ci.txt"
          if [ -s "$RUNNER_TEMP/req-ci.txt" ]; then python -m pip install -r "$RUNNER_TEMP/req-ci.txt"; fi
      - name: E2E через оркестратор A03
        if: steps.be.outputs.present == 'true'
        run: timeout 600 python -m testkit.e2e_stub --scenarios clean,V01 --duration 8 --fps 10 --deadline 60

  frontend:
    name: frontend build (необязательная)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Has frontend?
        id: fe
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend/package.json нет — пропуск"; fi
      - uses: actions/setup-node@v4
        if: steps.fe.outputs.present == 'true'
        with:
          node-version: "20"
      - name: Build
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present
          npm test --if-present

  ownership:
    name: ownership (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Files touched by non-owners
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_ownership.py --base "origin/$BASE_REF" --title "$PR_TITLE"
