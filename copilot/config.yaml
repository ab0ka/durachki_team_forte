# Sentinel Copilot (A14) — все пороги и пути. Переопределение: env COPILOT_CONFIG=<path>
# или точечно через env-переменные (см. README, раздел «Для интегратора»).

# Copilot — ОПЦИОНАЛЬНЫЙ модуль. На 8 ГБ VRAM ресурсы делятся с VLM, поэтому по умолчанию выключен.
# false — выключен (ask -> 501); true — включён; mock — включён только при SENTINEL_MOCK=1.
# env COPILOT_ENABLED=1/0 имеет приоритет.
enabled: mock

corpus:
  # Каталог норм (владелец A13). Пути относительны корня репозитория.
  catalog_path: norms/catalog.yaml
  sources_glob: norms/sources/*.md
  # Фикстура (тестовые, заведомо НЕ настоящие нормы) — только для тестов/мок-режима.
  # auto = разрешена, если SENTINEL_MOCK=1 или COPILOT_ALLOW_FIXTURE=1.
  fixture_fallback: auto
  fixture_dir: copilot/fixtures/norms
  chunk_max_chars: 900
  chunk_overlap_chars: 120
  chunk_min_chars: 40
  # Формат A13: разделы-не-нормы и служебные строки не цитируются; преамбулу под H1 пропускаем
  skip_sections_regex: 'не\s+цитат|пересказ|todo|реквизит|статус|провенанс'
  skip_lines_regex: '^\s*(?:провенанс|источник|\*\*внимание|внимание:)'
  skip_preamble: true
  cite_disabled: false     # нормы типов с legal_status=disabled не цитируем (честно «без пункта»)

embed:
  # auto: e5 (sentence-transformers / transformers), если веса есть локально; иначе hashing.
  backend: auto            # auto | e5 | hashing
  model: intfloat/multilingual-e5-small
  device: cpu              # корпус маленький — VRAM оставляем VLM
  batch_size: 32
  hashing_dim: 4096
  cache_dir: cache/copilot # gitignored

rag:
  top_k: 4
  min_score: 0.12          # ниже — фрагмент не считается найденным (для hashing; e5 ~0.75)
  min_score_e5: 0.78
  hybrid_lexical_weight: 0.35   # доля лексического (BM25-подобного) скора в гибридном ранжировании
  boost_violation_types: 0.15   # бонус нормам по type_id нарушений из результата

llm:
  backend: auto            # auto | llama_cpp | llama_server | extractive | mock
  # Кандидаты GGUF (первый существующий файл побеждает). Пути — от корня репо или абсолютные.
  model_candidates:
    - weights/copilot/sentinel-copilot-q4_k_m.gguf        # после LoRA + merge + quantize
    - weights/copilot/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    - weights/copilot/Qwen2.5-7B-Instruct-Q4_K_M.gguf
  lora_path: null          # GGUF-адаптер LoRA (опционально, вместо merge)
  n_ctx: 4096
  n_threads: null          # null = автоматически
  gpu_layers: auto         # auto | -1 (всё на GPU) | 0 (CPU) | N (частичный offload)
  vram_reserve_mb: 1500    # сколько VRAM оставить другим (VLM/детектор) при auto
  model_n_layers: 36       # для оценки частичного offload (Qwen3-4B: 36, Qwen2.5-7B: 28)
  idle_unload_s: 300       # выгружать модель после простоя (освобождает VRAM)
  max_tokens: 512
  temperature: 0.2
  top_p: 0.9
  repeat_penalty: 1.05
  timeout_s: 45            # бюджет генерации; по таймауту — честная ошибка timeout (HTTP 504)
  max_norm_refs: 6         # сколько фрагментов норм максимум кладём в контекст
  server_url: null         # напр. http://127.0.0.1:8081 (llama.cpp server). Только локальные адреса!
  allow_private_hosts: true  # 10.x/172.16-31.x/192.168.x и docker-имена без точки

guard:
  timecode_tolerance_s: 1.5
  min_support_ratio: 0.3   # доля слов предложения, опирающихся на результат/нормы; ниже — вырезается
  max_question_chars: 2000
  max_history_turns: 8
  max_history_chars: 4000

report:
  disclaimer: >-
    Это автоматическая подсказка для проверяющего, а не юридическое заключение.
    Решение о наличии нарушения принимает человек после просмотра видео.
