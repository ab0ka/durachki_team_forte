# Kassa Sentinel — ml/fusion (владелец A12): параметры слияния событий, доказательств и описаний.
# Пороги вердикта по типам — в thresholds.yaml (их подбирает `python -m ml.fusion.tune`).
# Любой ключ можно опустить — подставится значение по умолчанию из ml/fusion/config.py.
version: 1

grouping:
  merge_gap_s: 3.0            # события ОДНОГО типа, разделённые зазором ≤ этого, сливаются в одно нарушение
  cross_type_nms: true        # подавлять слабое нарушение другого типа, совпадающее по времени с сильным
  cross_type_ratio: 0.5       # ...если conf_слабого < ratio * conf_сильного
  cross_type_min_overlap: 0.5 # ...и перекрытие по времени ≥ доли от более короткого интервала

# Вес источника при объединении уверенностей (0..1).
sources:
  rules: 1.0
  temporal: 0.8
  vlm: 0.9            # событие/подтверждение от VLM (verify)
  vlm_discover: 0.7   # событие, найденное ТОЛЬКО VLM (discover), без поддержки rules/temporal
  fusion: 0.8
  other: 0.6

combine: noisy_or     # noisy_or | max — как объединять взвешенные уверенности источников

agreement:            # бонус за согласие независимых источников
  min_conf: 0.3       # источник «согласен», если его взвешенный вклад ≥ min_conf
  bonus_per_source: 0.07
  max_bonus: 0.15

vlm:
  reject_factor: 0.6      # множитель уверенности, если VLM отклонил событие (VLM-понижение)
  reject_min_score: 0.5   # учитывать отказ VLM, только если его уверенность в отказе ≥ этого
  unsure_factor: 1.0      # множитель при ответе VLM «не уверен»

risk:                     # риск-кривая temporal
  support_weight: 0.6     # вклад кривой в кластер, если явного temporal-события нет
  support_min: 0.5        # значения кривой ниже — не считаются поддержкой
  support_pad_s: 1.0      # окно поиска поддержки вокруг события
  high: 0.65              # «высокий риск» для событий только по кривой (правил нет)
  min_duration_s: 0.4     # минимальная длительность участка высокого риска
  only_factor: 0.7        # понижение уверенности для события только по кривой
  fallback_type: V99      # тип, если temporal не подсказал лучший
  max_events: 3           # не больше стольких событий только по кривой на видео

output:
  max_violations: 10
  timeline_step_s: 0.5
  timecode_round: 1       # знаков после запятой в timecode_sec
  candidate_floor: 0.15   # кандидаты ниже порога, но ≥ floor — в meta.fusion.candidates (подсказки для UI)

evidence:
  enabled: true
  max_frames: 3           # 1..3 кадра на нарушение
  window_s: 1.0           # поиск самого резкого кадра в t_peak ± window_s
  min_sep_s: 0.4          # кадры одного нарушения — разные моменты
  dup_mad: 1.5            # средняя абс. разность (0..255) ниже — кадры считаются дублями
  context_frame: true     # 3-й кадр: начало/конец длинного события
  context_min_gap_s: 1.5
  box_max_dt_s: 1.5       # боксы t_peak рисуем на кадрах не дальше этого от t_peak
  max_side: 1280          # большие кадры уменьшаем до этой стороны
  max_bytes: 200000       # JPEG ≤ 200 КБ
  jpeg_quality: [88, 80, 72, 64, 56, 48, 40, 32]
  budget_s: 20.0          # бюджет на все кадры видео; при превышении — по 1 кадру без поиска резкости
  blur_heads: true        # приватность: размытие голов
  head_frac: 0.18         # без ключевых точек — размываем верхние 18% бокса человека
  head_kp_min_score: 0.3
  draw_boxes: true
  font_paths: []          # доп. пути к TTF с кириллицей (env SENTINEL_FONT приоритетнее)

description:
  max_facts: 3
  max_chars: 420
  check_sentence: "Требуется проверка человеком."
  # Слова-домыслы (regex по основам, без учёта регистра). Предложения/факты с ними вычищаются.
  forbidden:
    - "укра[лд]\\w*"
    - "краж\\w*"
    - "вор(?:ов\\w*|ует|уют|овал\\w*|а|ы)?\\b"
    - "похи[тщ]\\w*"
    - "хищени\\w*"
    - "мошенни\\w*"
    - "умышленн\\w*"
    - "намеренн\\w*"
    - "преднамеренн\\w*"
    - "специально"
    - "с целью"
    - "преступ\\w*"
    - "злоумышл\\w*"
    - "виновн\\w*"
    - "сговор\\w*"
    - "обман\\w*"
    - "фальшив\\w*"
    - "поддел\\w*"
    - "подделк\\w*"
    - "недостач\\w*"
    - "растрат\\w*"
    - "присвоил\\w*"
    - "присвоени\\w*"
    - "нарушил\\w*"
