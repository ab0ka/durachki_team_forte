# ml/detect/config.yaml — все пороги модуля детекции (A05).
# Переопределение: env SENTINEL_DETECT_CONFIG=/path/to/override.yaml (глубокое слияние поверх этого файла).
version: 1

# ---------------- общий бюджет и выбор устройства ----------------
runtime:
  device: auto            # auto | cuda | cpu
  fp16: true              # только на CUDA
  budget_s: 30.0          # мягкий бюджет на detect() целиком; при превышении режем TTA/тайлы/open-vocab и увеличиваем шаг
  hard_budget_s: 60.0     # после этого — только closed-set с удвоенным шагом
  batch_size: 16          # closed-set батч (RTX 4060 8 GB, fp16)
  max_frames_in_memory: 32
  fallback_to_mock: true  # нет весов → mock (person по движению) вместо пустого результата; warning в last_stats()

# ---------------- бэкенд A: closed-set (каждый сэмпл) ----------------
closed_set:
  enabled: true
  # порядок попыток: первый доступный бэкенд выигрывает
  backends: [onnx_finetuned, hf]
  hf_model_id: PekingU/rtdetr_v2_r18vd          # Apache-2.0; альтернатива: ustc-community/dfine-small-coco
  hf_fallback_ids: [ustc-community/dfine-small-coco]
  onnx_path: detect/finetuned/model.onnx       # относительно SENTINEL_WEIGHTS
  onnx_labels: detect/finetuned/labels.json    # список имён классов (из LABELS)
  onnx_merge_with_hf: true                      # дообученная модель (cash, cash_bag, ...) + COCO-модель (person, ...)
  input_size: 640
  min_score: 0.15                               # «сырой» порог до TTA-слияния
  # пороги по меткам после слияния (вид сверху — COCO-модели видят хуже → для person ниже)
  score_thr:
    default: 0.40
    person: 0.25
    cell_phone: 0.25
    cup: 0.30
    bottle: 0.30
    food: 0.30
    laptop: 0.40
    bag: 0.30
    document: 0.35
    cash: 0.30
    cash_bag: 0.30
    money_counter: 0.35
    safe: 0.35
    safe_open: 0.35
  max_dets_per_frame: 60

# ---------------- TTA ----------------
tta:
  hflip: true               # горизонтальный флип
  hflip_on: keyframes       # all | keyframes  (keyframes — экономия ~2× времени)
  merge: wbf                # wbf | nms
  iou_thr: 0.55
  single_view_penalty: 0.85 # множитель score для боксов, найденных только в одном виде (wbf)

# ---------------- SAHI-стиль: слайсинг на тайлы ----------------
tiling:
  enabled: true
  on: keyframes             # all | keyframes | off
  tile_frac: 1.0            # сторона квадратного тайла = доля короткой стороны (1.0 → портрет 464×848 даёт 2 тайла)
  overlap: 0.15
  contained_ios: 0.8        # тайловый бокс, на ≥80% лежащий внутри полнокадрового той же метки, — дубль
  min_motion: 0.0           # тайлим только кадры с motion_energy >= (0 — все ключевые)
  keep_labels: [cell_phone, cup, bottle, food, cash, keys, document, money_counter]
  merge_iou: 0.5
  edge_margin: 0.01         # отбрасываем боксы, касающиеся внутренней границы тайла (обрезанные объекты)

# ---------------- бэкенд B: open-vocab (ключевые кадры) ----------------
open_vocab:
  enabled: true
  hf_model_id: google/owlv2-base-patch16-ensemble   # Apache-2.0
  input_size: 960           # родной размер OWLv2; меньше (768) → быстрее, с интерполяцией позиционных эмбеддингов
  batch_size: 4
  interval_s: 1.0           # регулярные ключевые кадры ~1 fps
  max_frames: 240           # потолок на видео
  nms_iou: 0.4
  max_dets_per_frame: 40
  # запрос → метка из LABELS + порог (OWLv2 даёт низкие score, пороги ~0.1–0.3)
  queries:
    - {text: "stack of banknotes",      label: cash,          thr: 0.20}
    - {text: "cash money",              label: cash,          thr: 0.22}
    - {text: "money counting machine",  label: money_counter, thr: 0.20}
    - {text: "metal safe",              label: safe,          thr: 0.18}
    - {text: "open safe door",          label: safe_open,     thr: 0.22}
    - {text: "green canvas bag",        label: cash_bag,      thr: 0.20}
    - {text: "glass door",              label: door,          thr: 0.18}
    - {text: "open door",               label: door_open,     thr: 0.22}
    - {text: "mobile phone in hand",    label: cell_phone,    thr: 0.20}
    - {text: "food",                    label: food,          thr: 0.25}
    - {text: "drink cup",               label: cup,           thr: 0.22}
    - {text: "keys",                    label: keys,          thr: 0.25}
  # максимальная площадь бокса (доля кадра), выше — отбрасываем (OWL любит «всю сцену»)
  max_area:
    default: 0.6
    door: 0.9
    door_open: 0.9
  min_area: 0.0004

# ---------------- activity gating ----------------
gating:
  motion_thumb_width: 64      # ширина миниатюры для своей разницы кадров
  motion_keyframe_thr: 0.035  # абсолютный порог motion_energy (0..1) для доп. ключевого кадра
  motion_rel_k: 2.5           # ... или > k × скользящая медиана
  min_gap_s: 0.4              # не чаще одного motion-кадра за min_gap_s
  window: 25                  # окно скользящей медианы (кадров)

# ---------------- финальное слияние источников ----------------
merge:
  iou_thr: 0.6               # NMS между closed-set / tiles / open-vocab внутри одной метки
  cross_label_suppress:      # если open-vocab и closed-set дают одно и то же, оставляем одну метку
    - [cell_phone, cell_phone]

# ---------------- mock (SENTINEL_MOCK=1) ----------------
# Синтетика: фон тёмный, объекты — залитые эллипсы/прямоугольники цветов ниже (BGR).
mock:
  tolerance: 28            # допуск по каждому каналу BGR
  min_area_px: 30
  score: 0.9
  motion_person: true      # на реальных видео в mock-режиме: крупные движущиеся пятна → person (score 0.5)
  motion_person_min_area: 0.02
  palette:                 # BGR — см. ml/detect/synth.py
    person:        [0, 0, 255]
    cell_phone:    [255, 0, 255]
    cup:           [0, 255, 255]
    bottle:        [255, 255, 0]
    food:          [0, 140, 255]
    cash:          [140, 255, 140]
    money_counter: [128, 0, 128]
    laptop:        [70, 70, 70]
    safe:          [170, 170, 170]
    safe_open:     [255, 0, 0]
    door:          [255, 200, 140]
    door_open:     [200, 100, 0]
    cash_bag:      [0, 110, 0]
    bag:           [20, 70, 140]
    document:      [245, 245, 245]
    keys:          [0, 200, 200]
