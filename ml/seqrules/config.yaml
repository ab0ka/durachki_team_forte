# ml.seqrules — правила по последовательностям наблюдений (L2, профиль pose_rules).
# ВСЕ длительности и пороги ниже — технические параметры распознавания, НЕ требования нормативных актов.
# Переопределение: env SENTINEL_SEQRULES_CONFIG=path.yaml (глубокое слияние поверх этого файла).
version: 1

person:
  staff_roles: [cashier, collector]
  work_zone: cashier_area         # зона A06 «где работает кассир» (из треков), не физический предмет «касса/сейф»
  box_time_tolerance_s: 0.12      # поза/предмет относятся к кадру трека, если их PTS ближе (≈ полкадра при 5 fps)
  zone_min_overlap: 0.25          # доля нижней половины bbox человека внутри зоны → «в зоне»

phone:                            # правило А — мобильный телефон у руки/головы конкретного человека
  enabled: true
  type_id: V05
  labels: [cell_phone]
  min_score: 0.30                 # score детектора телефона
  wrist_min: 0.30                 # score запястья (видимость сустава)
  head_min: 0.30
  near_hand_rel: 0.25             # центр телефона ≤ доли высоты человека от запястья
  near_head_rel: 0.22
  min_duration_s: 1.5
  max_gap_s: 1.0                  # краткая потеря (absent/unknown) внутри эпизода допускается
  min_observed_frames: 4
  carry_move_rel: 0.06            # телефон смещается (≥ доли высоты человека) — его держат, а не лежит рядом
  head_fraction: 0.3              # или у головы на такой доле наблюдений
  staff_zone_fraction: 0.5        # человек без роли staff считается на рабочем месте, если столько кадров в зоне
  confidence: {base: 0.55, per_s: 0.03, max: 0.8, mobile_bonus: 0.05}

safe:                             # правило Б — открытый сейф, в рабочей зоне никого нет
  enabled: true
  type_id: V03
  absent_min_s: 3.0               # подряд обработанных кадров без людей в рабочей зоне
  max_gap_s: 0.6                  # необработанные кадры внутри отсутствия (их не считаем ни «есть», ни «нет»)
  exit_window_s: 3.0              # уход подтверждён: последний сотрудник виден вне зоны в этом окне
  max_seen_after_exit_frac: 0.3   # после выхода виден в кадре дольше этой доли отсутствия → рядом, не «без присмотра»
  min_open_checks: 2              # подряд «open» без «closed» между ними
  first_check_after_s: 1.0
  check_every_s: 2.0
  confidence: {base: 0.6, per_check: 0.05, max: 0.85}

entry:                            # правило В — вход в рабочую зону (наблюдение, не обвинение)
  enabled: true
  type_id: V01
  dwell_s: 2.0
  max_gap_s: 0.6
  confidence: 0.35

hand_cash:                        # «рука — деньги»: только наблюдение; включать, когда детектор денег подтверждён
  enabled: false
  labels: [cash]
  min_score: 0.30
  near_rel: 0.20
  max_gap_s: 0.6
  min_duration_s: 0.6

checks:                           # ограниченные проверки по кадрам (OWLv2 из ml.detect); пропуск ≠ «проверено»
  enabled: true
  budget_s: 25.0
  phone_contrast:                 # «мобильный» против похожих предметов стола на кропе вокруг телефона
    enabled: true
    max_checks: 8
    per_episode: 2
    phone_queries: ["mobile phone", "smartphone"]
    not_phone_queries: ["desk telephone", "landline phone", "calculator", "card payment terminal", "computer mouse"]
    min_score: 0.2
    margin: 0.05
    crop_scale: 6.0               # сторона кропа = scale × сторона бокса телефона
    crop_min_side_rel: 0.25       # не меньше доли короткой стороны кадра
    match_iou: 0.15
  safe_state:
    enabled: true
    max_checks: 12
    per_interval: 4

merge_gap_s: 2.0                  # повторы одного правила одного человека ближе — одно событие
max_observation_frames: 2500      # потолок кадров в observations (для UI); лишнее равномерно прореживается
episode_min_frames_saved: 2       # эпизоды короче — только счётчиком, без кадров
